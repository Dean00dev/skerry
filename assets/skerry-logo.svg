<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Skerry: a rock hidden just below the waterline">
  <title>Skerry</title>
  <defs>
    <clipPath id="disc">
      <circle cx="128" cy="128" r="120"/>
    </clipPath>
  </defs>

  <circle cx="128" cy="128" r="120" fill="#0b2942"/>

  <g clip-path="url(#disc)">
    <!-- water below the line -->
    <rect x="0" y="150" width="256" height="106" fill="#12507d"/>

    <!-- the submerged mass: the part nobody sees -->
    <path d="M52 256 L104 150 L152 150 L208 256 Z" fill="#0e3a5c"/>

    <!-- the visible tip above the waterline -->
    <path d="M104 150 L128 74 L152 150 Z" fill="#e8eef4"/>
    <path d="M128 74 L152 150 L128 150 Z" fill="#b9c8d6"/>

    <!-- waterline -->
    <rect x="0" y="146" width="256" height="7" fill="#7fd4ff"/>
  </g>

  <circle cx="128" cy="128" r="120" fill="none" stroke="#7fd4ff" stroke-width="10"/>
</svg>
